name: Test Branch

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # https://github.com/jdx/mise-action/releases
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          check-latest: true
          go-version-file: go.mod

      - name: Setup golangci-lint cache
        # https://github.com/actions/cache/releases
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}--

      - name: Run tidy
        run: make tidy && git diff --exit-code

      - name: Run generate
        run: make generate && git diff --exit-code

      - name: Run lint
        run: make lint.branch

      - name: Run tests
        run: make test
